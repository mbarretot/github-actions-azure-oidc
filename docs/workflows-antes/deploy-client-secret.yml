# Reference only: the "Antes" workflow that logged in with a client secret.
# It lives outside .github/workflows on purpose, so GitHub Actions never runs it.
# The active workflow is .github/workflows/deploy.yml (OIDC, no secrets).

name: Deploy to Azure App Service

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: github-oidc-demo-6608
  PROJECT_PATH: src/CleanArchitecture.Presentation/CleanArchitecture.Presentation.csproj

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish "$PROJECT_PATH" -c Release -o ./publish

      - name: Azure login (client secret)
        uses: azure/login@v3
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}",
             "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
